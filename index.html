<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的待办</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200..900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="main.css"/>
</head>
<body>
    <main class="app">
        <section class="greeting">
            <div class="clock" id="clock"></div>
            <h2 class="title">
                最近怎么样, <input type="text" id="name" placeholder="Name here" autocomplete="off"> <!--文本框id为name，待输入-->
            </h2>
        </section>
        <!--待办事项部分，要添加自己的待办事项-->
        <section class="create-todo">
            <h3>创建一个待办清单</h3>
            <form id="new-todo-form">

                <h4>添加一个新的待办事项</h4>
                <input 
                    type="text" 
                    name="content" 
                    id="content" 
                    placeholder="复习考研数学"/>

                <h4>待办种类是</h4>
                <div class="options">
                    <label><!--添加一个紧急事项按钮-->
                        <input 
                            type="radio"
                            name="category"
                            id="category1"
                            value="emergency" />
                        <span class="bubble emergency"></span>
                        <div>紧急</div> 
                    </label>

                    <label><!--添加一个非紧急事项按钮-->
                        <input 
                            type="radio"
                            name="category"
                            id="category2"
                            value="noemergency" />
                        <span class="bubble noemergency"></span>
                        <div>非紧急</div> 
                    </label>
                </div>

                <input type="submit" value="添加代办" /> <!--添加待办事项按钮-->
            </form>
        </section>

        <section class="todo-list">
            <h3>待办事项</h3>

            <div class="list" id="todo-list"></div>
        </section>
    </main>
    <script src="main.js"></script>
</body>
</html>
